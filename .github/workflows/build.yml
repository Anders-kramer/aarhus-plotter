name: Test and container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - name: Build and test restricted container
        run: |
          docker build -t plotter:test .
          docker run -d --name plotter-test --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --memory 2g \
            -e APP_PASSWORD="synthetic-ci-password-only" \
            -v plotter-test-data:/data -p 127.0.0.1:8088:8080 plotter:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8088/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8088/health
          docker exec plotter-test python -c "from pathlib import Path; p=Path('/data/write-test'); p.write_text('ok'); assert p.read_text()=='ok'; p.unlink()"
          test "$(docker exec plotter-test id -u)" = 10001
          docker stop plotter-test
          docker start plotter-test
          sleep 5
          curl -fsS http://127.0.0.1:8088/health
      - if: always()
        run: docker logs plotter-test || true
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/anders-kramer/aarhus-plotter:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/Anders-kramer/aarhus-plotter
