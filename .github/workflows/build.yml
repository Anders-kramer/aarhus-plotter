name: Test and container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: node --test tests/ui_state.cjs
      - name: Build and test restricted container
        run: |
          docker build -t plotter:test .
          docker run -d --name plotter-test --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --memory 2g \
            --health-interval=2s --health-start-period=2s \
            -e APP_PASSWORD="synthetic-ci-password-only" \
            -v plotter-test-data:/data -p 127.0.0.1:8088:8080 plotter:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8088/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8088/health
          sleep 4
          test "$(docker inspect -f '{{.State.Health.Status}}' plotter-test)" = healthy
          docker exec plotter-test python -c "from pathlib import Path; p=Path('/data/write-test'); p.write_text('ok'); assert p.read_text()=='ok'; p.unlink()"
          test "$(docker exec plotter-test id -u)" = 10001
          docker exec -i plotter-test python - < tests/container_smoke.py
          docker stop plotter-test
          docker start plotter-test
          sleep 5
          curl -fsS http://127.0.0.1:8088/health
      - name: Attach public offline image to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag plotter:test "ghcr.io/anders-kramer/aarhus-plotter:$version"
          docker save "ghcr.io/anders-kramer/aarhus-plotter:$version" | gzip > "aarhus-plotter-$version-linux-amd64.tar.gz"
          cp deploy/truenas.yaml .
          cp deploy/truenas-offline.yaml .
          sha256sum "aarhus-plotter-$version-linux-amd64.tar.gz" truenas.yaml truenas-offline.yaml > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --draft --title "Aarhus Plotter $version" --notes-file docs/release.md
          gh release upload "$GITHUB_REF_NAME" "aarhus-plotter-$version-linux-amd64.tar.gz" truenas.yaml truenas-offline.yaml SHA256SUMS --clobber
      - if: always()
        run: docker logs plotter-test || true
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/anders-kramer/aarhus-plotter:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Anders-kramer/aarhus-plotter
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
  anonymous-pull:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Pull and run without registry credentials
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          image="ghcr.io/anders-kramer/aarhus-plotter:${GITHUB_REF_NAME#v}"
          docker pull "$image"
          test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          docker run -d --name anonymous-plotter --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --memory 2g \
            -e APP_PASSWORD="synthetic-ci-password-only" \
            -v anonymous-test-data:/data -p 127.0.0.1:8088:8080 "$image"
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8088/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8088/health
          docker exec -i anonymous-plotter python - < tests/container_smoke.py
          docker stop anonymous-plotter
