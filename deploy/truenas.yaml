# TrueNAS Apps > Discover Apps > menu > Install via YAML
# Replace the bind IP and data path with verified local values.
# Create password.txt yourself, readable by UID 10001, outside the data directory.
# Do not expose this HTTP service to the internet.
services:
  plotter:
    image: ghcr.io/anders-kramer/aarhus-plotter:1.1.0
    environment:
      APP_PASSWORD_FILE: /run/secrets/password
    ports:
      - "192.0.2.10:8088:8080"
    volumes:
      - /mnt/POOL/aarhus-plotter/data:/data
      - /mnt/POOL/aarhus-plotter/password.txt:/run/secrets/password:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    stop_grace_period: 60s
